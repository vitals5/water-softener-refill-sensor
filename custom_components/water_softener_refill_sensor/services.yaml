refill:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: water_softener_refill_sensor
    kg:
      required: true
      example: 25
      selector:
        number:
          min: 0.5
          max: 1000
          step: 0.5
          mode: box
          unit_of_measurement: kg

set_salt_stock:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: water_softener_refill_sensor
    kg:
      required: true
      example: 12
      selector:
        number:
          min: 0
          max: 1000
          step: 0.5
          unit_of_measurement: kg

add_regeneration:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: water_softener_refill_sensor
    count:
      required: false
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box

set_last_regeneration:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: water_softener_refill_sensor
    datetime:
      required: true
      example: "2026-10-04 02:30:00"
      selector:
        datetime:

set_regenerations_since_refill:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: water_softener_refill_sensor
    count:
      required: true
      example: 5
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box
